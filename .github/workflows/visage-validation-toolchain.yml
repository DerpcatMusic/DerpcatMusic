name: Visage validation toolchain
on:
  push:
    branches: [visage-egui-wasm-proof]
    paths: [.github/workflows/visage-validation-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Fetch exact geometry and egui dependencies
        shell: bash
        run: |
          mkdir -p /tmp/probe/src
          cat >/tmp/probe/Cargo.toml <<'EOF'
          [package]
          name = "visage-validation-deps"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          i_overlay = "=8.1.0"
          egui = { version = "=0.36.2", default-features = false }
          lyon_tessellation = "=1.0.20"
          EOF
          touch /tmp/probe/src/lib.rs
          cargo fetch --manifest-path /tmp/probe/Cargo.toml --target wasm32-unknown-unknown
          cargo fetch --manifest-path /tmp/probe/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Package offline validation environment
        shell: bash
        run: |
          mkdir -p /tmp/validation/toolchain /tmp/validation/cargo
          SYSROOT="$(rustc --print sysroot)"
          cp -a "$SYSROOT/bin" "$SYSROOT/lib" /tmp/validation/toolchain/
          cp -a "$HOME/.cargo/registry" /tmp/validation/cargo/
          cp /tmp/probe/Cargo.lock /tmp/validation/dependencies.lock
          rustc -Vv >/tmp/validation/RUSTC.txt
          cargo -V >>/tmp/validation/RUSTC.txt
          tar -C /tmp/validation -czf /tmp/visage-validation-env.tar.gz .
          ls -lh /tmp/visage-validation-env.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: visage-validation-environment
          path: /tmp/visage-validation-env.tar.gz
          compression-level: 0
          retention-days: 1
