[package]
name = "egui-wasm-shape-lab"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib_autolayout.rs"
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.36.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
